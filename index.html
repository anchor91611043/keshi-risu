          // この段に配置するブロックの個数を4～7個から選びます。
          const count = 4 + Math.floor(
            Math.random() * 4
          );


          /*
            横方向の列番号を用意します。

            0～9の10個の数字です。

            この配列をシャッフルすることで、
            同じ列へ重複して配置することを防ぎます。
          */
          const columns = Array.from(
            { length: COLS },
            (_, i) => i
          );


          /*
            列番号をシャッフルします。

            Fisher-Yatesシャッフルという方法です。

            配列の後ろから順番に、
            ランダムに選んだ要素と入れ替えています。
          */
          for (
            let i = columns.length - 1;
            i > 0;
            i--
          ) {

            const j = Math.floor(
              Math.random() * (i + 1)
            );

            [columns[i], columns[j]] =
              [columns[j], columns[i]];

          }


          /*
            シャッフルした列番号から、
            必要な数だけブロックを配置します。
          */
          for (let i = 0; i < count; i++) {

            const x = columns[i];

            // 実際の盤面にブロックを置きます。
            grid[y][x] =
              1 + Math.floor(Math.random() * 7);


            // 同じ場所を目標ブロックとして記録します。
            targetGrid[y][x] = true;

          }

        }

      }



      /*
        ==========================================================
        8. ブロックを固定する処理
        ==========================================================

        ブロックが下に移動できなくなったとき、
        そのブロックを盤面に固定します。

        固定した後は、
          ・ライン消去
          ・次のブロック生成
          ・ゲームオーバー判定
        を行います。
      */
      function lockPiece() {

        /*
          現在操作しているブロックの形を調べ、
          盤面に固定します。

          piece.shape内の1はブロックが存在する場所です。
        */
        // ブロックを固定したので、接地時間をリセットする
        lockDelayCounter = 0;

        piece.shape.forEach((row, y) => {

          row.forEach((cell, x) => {

            if (
              cell &&
              piece.y + y >= 0
            ) {

              grid[piece.y + y][piece.x + x] =
                piece.type;

            }

          });

        });


        // ブロックを固定したので、ライン消去を確認します。
        clearLines();


        /*
          ライン消去の結果、お題クリアになった場合は、
          次のブロックを生成する必要がないため終了します。
        */
        if (clearedPuzzle) return;


        // 次のブロックを作ります。
        piece = makePiece(nextType);

        // 新しいブロックになったので、リセット回数を0に戻す
        lockResetCount = 0;

        // その次に出現するブロックを決めます。
        nextType = randomType();

        // NEXT表示を更新します。
        drawNext();


        /*
          新しいブロックがすでに何かと重なっている場合、
          これ以上ゲームを続けられないためゲームオーバーです。
        */
        if (collides(piece)) {
          endGame();
        }

      }



      /*
        ==========================================================
        9. ライン消去処理
        ==========================================================

        横一列がすべて埋まった場合、
        その段を消去します。

        また、目標ブロックの情報も、
        盤面と同じように移動・消去させます。

        ここはお題クリア判定にも関わる重要な処理です。
      */
      function clearLines() {

        // 今回消したライン数を記録します。
        let cleared = 0;


        /*
          下の段から上の段へ向かって確認します。

          下から確認するのは、
          ラインを消した際に上の段が下へ移動するためです。
        */
        for (
          let y = ROWS - 1;
          y >= 0;
          y--
        ) {

          /*
            every()は、配列のすべての要素が
            条件を満たしているか確認する命令です。

            ここでは、すべてのマスが0以外、
            つまりブロックで埋まっているか確認します。
          */
          if (
            grid[y].every(cell => cell !== 0)
          ) {

            // 埋まっていた段を削除します。
            grid.splice(y, 1);

            // 盤面の一番上に空の段を追加します。
            grid.unshift(Array(COLS).fill(0));


            /*
              目標ブロックの記録も同じように移動させます。

              これを忘れると、実際のブロックと
              目標ブロックの記録がずれてしまいます。
            */
            targetGrid.splice(y, 1);

            targetGrid.unshift(
              Array(COLS).fill(false)
            );


            // ラインを消した数を増やします。
            cleared++;

            /*
              上の段が下に移動したことで、
              現在確認している行には新しい段が来ています。

              そのため、同じ行をもう一度確認する必要があります。
            */
            y++;

          }

        }


        /*
          --------------------------------------------------------
          スコア・レベルの更新
          --------------------------------------------------------

          1ライン：100点
          2ライン：300点
          3ライン：500点
          4ライン：800点

          さらに、現在のレベルを掛け算します。
        */
        if (cleared) {

          score +=
            [0, 100, 300, 500, 800][
              Math.min(cleared, 4)
            ] * level;


          // 累計ライン数を増やします。
          lines += cleared;


          /*
            10ライン消すごとにレベルが1上がります。

            例えば、
              0～9ライン  → レベル1
              10～19ライン → レベル2
              20～29ライン → レベル3

            となります。
          */
          level = Math.floor(lines / 10) + 1;


          // 画面に表示している情報を更新します。
          updateStats();

        }


        /*
          --------------------------------------------------------
          お題クリア判定
          --------------------------------------------------------

          targetGridの中にtrueが一つも残っていなければ、
          最初から配置されていた目標ブロックが
          すべて消えたことになります。

          その場合は、お題クリアです。

          プレイヤーが後から配置したブロックが残っていても、
          目標ブロックさえすべて消えていればクリアになります。
        */
        if (
          targetGrid.every(
            row => row.every(cell => cell === false)
          )
        ) {

          // クリア状態にします。
          clearedPuzzle = true;

          // ゲームの進行を停止します。
          running = false;


          // クリアメッセージを表示します。
          showOverlay(
            "クリア！",

            `スコア：<strong>${score.toLocaleString("ja-JP")}</strong><br>
             次のお題を始めよう。`,

            "次のお題へ"
          );

        }

      }



      /*
        ==========================================================
        10. ブロックの描画
        ==========================================================

        Canvasにブロックを描画する処理です。

        drawCell()
          → 通常のプレイヤーのブロックを描画

        drawTargetCell()
          → 最初から配置されていた目標ブロックを描画

        色や形など、見た目に関する処理を担当しています。
      */


      /*
        通常のブロックを描画します。

        context
          → 描画先のCanvas

        x・y
          → マス目の位置

        type
          → ブロックの種類

        size
          → 1マスの大きさ

        メイン盤面とNEXT表示など、
        別のCanvasでも使えるように引数で指定できる形にしています。
      */
      function drawCell(
        context,
        x,
        y,
        type,
        size
      ) {

        // ブロックの種類が0なら何も描画しません。
        if (!type) return;


        // Canvas上での実際の描画位置を計算します。
        const px = x * size;
        const py = y * size;


        // ブロック本体の色を設定します。
        context.fillStyle = COLORS[type];

        // ブロック本体を描画します。
        context.fillRect(
          px + 1,
          py + 1,
          size - 2,
          size - 2
        );


        /*
          ブロック上部に少し明るい線を入れます。

          これによって、単なる平面ではなく、
          少し立体的に見えるようにしています。
        */
        context.fillStyle = "rgba(255,255,255,.22)";

        context.fillRect(
          px + 3,
          py + 3,
          size - 6,
          Math.max(2, size * .12)
        );


        // ブロックの輪郭を描画します。
        context.strokeStyle = "rgba(5,10,25,.35)";
        context.lineWidth = 1;

        context.strokeRect(
          px + 1.5,
          py + 1.5,
          size - 3,
          size - 3
        );

      }


      /*
        目標ブロックを描画します。

        通常のブロックと見分けられるよう、
        灰色をベースに斜線を入れています。

        ここではブロックの種類による色分けは行いません。
        目標ブロックはすべて同じ見た目です。
      */
      function drawTargetCell(
        context,
        x,
        y,
        size
      ) {

        // Canvas上での描画位置
        const px = x * size;
        const py = y * size;


        // 目標ブロック本体の色
        context.fillStyle = "#e8edf5";

        context.fillRect(
          px + 1,
          py + 1,
          size - 2,
          size - 2
        );


        // 上部に明るい部分を描画します。
        context.fillStyle = "rgba(255,255,255,.45)";

        context.fillRect(
          px + 3,
          py + 3,
          size - 6,
          Math.max(2, size * .12)
        );


        // ブロックの輪郭
        context.strokeStyle = "#3e4b64";
        context.lineWidth = 1.5;

        context.strokeRect(
          px + 1.5,
          py + 1.5,
          size - 3,
          size - 3
        );


        /*
          斜線を描画します。

          moveTo
            → 線を描き始める位置

          lineTo
            → 線の終点

          stroke
            → 実際に線を描画する命令
        */
        context.beginPath();

        context.strokeStyle = "#697992";
        context.lineWidth = 2.2;

        context.moveTo(
          px + 8,
          py + size - 8
        );

        context.lineTo(
          px + size - 8,
          py + 8
        );

        context.stroke();

      }



      /*
        ==========================================================
        11. メイン盤面の描画
        ==========================================================

        draw()は、現在のゲーム状態をCanvasに描き直します。

        例えば、
          ・ブロックを移動した
          ・ブロックを回転した
          ・ラインを消した
          ・新しいブロックが出現した
        などのタイミングで呼び出されます。
      */
      function draw() {

        // まず盤面全体を消去します。
        ctx.clearRect(
          0,
          0,
          boardCanvas.width,
          boardCanvas.height
        );


        /*
          --------------------------------------------------------
          盤面のグリッド線
          --------------------------------------------------------

          各マス目の境界線を薄く描画します。

          ブロックがない場所でもマス目が見えるため、
          盤面の位置を把握しやすくなります。
        */
        ctx.strokeStyle = "#18233b";
        ctx.lineWidth = 1;


        // 縦方向の線
        for (
          let x = 0;
          x <= COLS;
          x++
        ) {

          ctx.beginPath();

          ctx.moveTo(
            x * CELL + .5,
            0
          );

          ctx.lineTo(
            x * CELL + .5,
            ROWS * CELL
          );

          ctx.stroke();

        }


        // 横方向の線
        for (
          let y = 0;
          y <= ROWS;
          y++
        ) {

          ctx.beginPath();

          ctx.moveTo(
            0,
            y * CELL + .5
          );

          ctx.lineTo(
            COLS * CELL,
            y * CELL + .5
          );

          ctx.stroke();

        }


        /*
          --------------------------------------------------------
          盤面に固定されているブロック
          --------------------------------------------------------

          gridの中身を一つずつ確認して描画します。

          targetGridがtrueなら目標ブロック、
          falseなら通常のプレイヤーブロックとして描画します。
        */
        grid.forEach((row, y) => {

          row.forEach((type, x) => {

            // 空きマスは描画しません。
            if (!type) return;


            if (targetGrid[y][x]) {

              // 目標ブロック
              drawTargetCell(
                ctx,
                x,
                y,
                CELL
              );

            } else {

              // プレイヤーのブロック
              drawCell(
                ctx,
                x,
                y,
                type,
                CELL
              );

            }

          });

        });


        /*
          --------------------------------------------------------
          操作中のブロック
          --------------------------------------------------------

          pieceが存在する場合、現在操作しているブロックを描画します。

          さらに、そのブロックを一気に落とした場合の
          着地点をゴーストとして表示します。
        */
        if (piece) {

          // ゴーストの仮のY座標
          let ghostY = piece.y;


          /*
            ゴーストを1マスずつ下へ移動させて、
            衝突する直前の位置を探します。

            ここでは実際のpiece.yは変更しません。
            ゴースト用のghostYだけを変更します。
          */
          while (
            !collides(
              { ...piece, y: ghostY },
              0,
              1
            )
          ) {

            ghostY++;

          }


          // ブロックの各マスを描画します。
          piece.shape.forEach((row, y) => {

            row.forEach((cell, x) => {

              if (cell) {

                /*
                  まずゴーストを半透明で描画します。

                  globalAlphaはCanvas全体の透明度を設定する値です。
                  .22にすると、かなり薄く表示されます。
                */
                ctx.globalAlpha = .22;

                drawCell(
                  ctx,
                  piece.x + x,
                  ghostY + y,
                  piece.type,
                  CELL
                );


                // 透明度を元に戻します。
                ctx.globalAlpha = 1;


                // 実際に操作しているブロックを描画します。
                drawCell(
                  ctx,
                  piece.x + x,
                  piece.y + y,
                  piece.type,
                  CELL
                );

              }

            });

          });

        }

      }



      /*
        ==========================================================
        12. NEXT表示の描画
        ==========================================================

        次に出現するテトリミノを、
        右側の小さなCanvasに描画します。

        メイン盤面とは別のCanvasなので、
        こちらを描画してもメイン盤面には影響しません。
      */
      function drawNext() {

        // NEXT表示を一度消去します。
        nctx.clearRect(
          0,
          0,
          nextCanvas.width,
          nextCanvas.height
        );


        // 次のブロックが未設定なら終了します。
        if (!nextType) return;


        // 次のブロックの形
        const shape = SHAPES[nextType];


        // NEXT表示用の1マスの大きさ
        const size = 24;


        // ブロック全体の横幅・縦幅
        const width = shape[0].length * size;
        const height = shape.length * size;


        /*
          NEXT用Canvasの中央に表示するため、
          描画開始位置を計算します。
        */
        const ox =
          (nextCanvas.width - width) / 2;

        const oy =
          (nextCanvas.height - height) / 2;


        // ブロックを一つずつ描画します。
        shape.forEach((row, y) => {

          row.forEach((cell, x) => {

            // 0のマスは何も描画しません。
            if (!cell) return;


            // ブロック本体
            nctx.fillStyle = COLORS[nextType];

            nctx.fillRect(
              ox + x * size + 1,
              oy + y * size + 1,
              size - 2,
              size - 2
            );


            // ブロック上部の明るい部分
            nctx.fillStyle = "rgba(255,255,255,.22)";

            nctx.fillRect(
              ox + x * size + 3,
              oy + y * size + 3,
              size - 6,
              3
            );

          });

        });

      }



      /*
        ==========================================================
        13. スコアなどの表示更新
        ==========================================================

        JavaScript内で管理している数値を、
        HTML側に表示している数値へ反映します。

        ゲーム内のscore・lines・levelを変更した場合は、
        この関数を呼び出すことで画面表示も更新されます。
      */
      function updateStats() {

        document.getElementById("score").textContent =
          score.toLocaleString("ja-JP");

        document.getElementById("lines").textContent =
          lines;

        document.getElementById("level").textContent =
          level;

      }



      /*
        ==========================================================
        14. メッセージ表示の制御
        ==========================================================

        ゲーム開始前やクリア時などに表示する
        メッセージ画面を操作する関数です。
      */


      /*
        メッセージを表示します。

        title
          → 見出し

        message
          → 本文

        buttonText
          → ボタンの表示文字

        textEl.innerHTMLを使っているため、
        message内で<strong>や<br>などのHTMLを利用できます。
      */
      function showOverlay(
        title,
        message,
        buttonText
      ) {

        titleEl.textContent = title;

        textEl.innerHTML = message;

        startBtn.textContent = buttonText;

        // hiddenクラスを外して表示します。
        overlay.classList.remove("hidden");

      }


      /*
        メッセージ画面を非表示にします。

        hiddenクラスを追加することで、
        CSS側でdisplay:noneになります。
      */
      function hideOverlay() {

        overlay.classList.add("hidden");

      }

      /*
        ============================================================
        設定画面を開く
        ============================================================

        設定画面を表示し、その間ゲームを一時停止します。

        ただし、ゲームが開く前から一時停止中だった場合もあるため、
        現在のpausedの状態を先に保存しておきます。
      */
      function openSettings() {

        // 設定画面を開く直前の状態を保存します。
        pausedBeforeSettings = paused;

        // ゲームを一時停止させます。
        paused = true;

        // 設定画面を表示します。
        settingsScreen.hidden = false;

      }


      /*
        ============================================================
        設定画面を閉じる
        ============================================================

        設定画面を非表示にし、
        開く前のゲーム状態に戻します。
      */
      function closeSettings() {

        // 設定画面を非表示にします。
        settingsScreen.hidden = true;

        // 開く前の一時停止状態に戻します。
        paused = pausedBeforeSettings;

        /*
          時間計測をリセットします。

          設定画面を開いていた時間が、
          ゲーム再開直後の落下処理に影響しないようにします。
        */
        lastTime = 0;

      }

      /*
        ============================================================
        ボタン配置モードを開く
        ============================================================

        設定画面からボタン配置モードへ移動します。

        処理の流れ：
          ① 設定画面を非表示にする
          ② ボタン配置画面を表示する

        注意：
        ここではpausedの状態を変更しません。

        設定画面を開いた時点でゲームは一時停止しているため、
        ボタン配置モードでもその状態を維持します。
      */
      function openLayoutEditor() {

        // 設定画面を非表示にします。
        settingsScreen.hidden = true;

        // ボタン配置画面を表示します。
        layoutScreen.hidden = false;

      }


      /*
        ============================================================
        ボタン配置モードを閉じる
        ============================================================

        ボタン配置モードから設定画面へ戻ります。

        処理の流れ：
          ① ボタン配置画面を非表示にする
          ② 設定画面を再表示する

        ここでもゲームの一時停止状態は変更しません。

        そのため、配置編集を終えて設定画面に戻っても、
        ゲームが勝手に再開することはありません。
      */
      function closeLayoutEditor() {

        

        // ボタン配置画面を非表示にします。
        layoutScreen.hidden = true;

        // 設定画面を再表示します。
        settingsScreen.hidden = false;

      }

      /*
        ============================================================
        ボタン配置のドラッグ管理
        ============================================================

        今回追加するドラッグ機能全体を管理します。

        layoutDrag
          → 現在ドラッグしているボタンの情報を保存します。

        ドラッグしていないときはnullになります。

        保存する情報：
          button     → 移動中のボタン
          pointerId  → 操作している指やマウスの識別番号
          offsetX    → ボタンの左端から押した位置までの距離
          offsetY    → ボタンの上端から押した位置までの距離
      */
      let layoutDrag = null;


      /*
        ============================================================
        配置可能な場所かどうかを確認する
        ============================================================

        button
          → 移動させようとしているボタン

        col
          → 移動先の左端の列番号

        row
          → 移動先の上端の行番号

        この関数では、次の3つを確認します。

          ① L字型のマス目からはみ出していないか
          ② 空白部分に配置しようとしていないか
          ③ 他のボタンと重なっていないか

        すべて問題なければtrueを返します。
        1つでも問題があればfalseを返します。
      */
      function isValidLayoutPosition(button, col, row) {

        // 移動対象のボタンが使用するマス数を取得します。
        const width = Number(button.dataset.layoutWidth);
        const height = Number(button.dataset.layoutHeight);


        /*
          ----------------------------------------------------------
          ① 配置範囲の確認
          ----------------------------------------------------------

          全体は横8マス×縦6マスです。

          左端は1列目、上端は1行目です。

          ボタンの右端・下端が範囲を超えないか確認します。
        */
        if (
          col < 1 ||
          row < 1 ||
          col + width - 1 > 8 ||
          row + height - 1 > 6
        ) {

          return false;

        }

        /*
          ----------------------------------------------------------
          左右の領域をまたいでいないか確認
          ----------------------------------------------------------

          実際のゲーム画面では、下部と右側を
          別々のGridとして管理します。

          そのため、1つのボタンが両方の領域にまたがる配置は
          許可しません。

          下部：
            横1～6列
            縦5～6行

          右側：
            横7～8列
            縦1～6行

          isBottomRegion
            → ボタン全体が下部に収まっているか

          isRightRegion
            → ボタン全体が右側に収まっているか
        */

        // ボタン全体が下部の範囲に収まっているか確認します。
        const isBottomRegion =
          col >= 1 &&
          col + width - 1 <= 6 &&
          row >= 5 &&
          row + height - 1 <= 6;


        // ボタン全体が右側の範囲に収まっているか確認します。
        const isRightRegion =
          col >= 7 &&
          col + width - 1 <= 8 &&
          row >= 1 &&
          row + height - 1 <= 6;


        // どちらにも収まっていなければ配置できません。
        if (!isBottomRegion && !isRightRegion) {
          return false;
        }


        /*
          ----------------------------------------------------------
          ② L字型の空白部分に入っていないか確認
          ----------------------------------------------------------

          配置できる範囲は次のとおりです。

          下部：
            1～6列目、5～6行目

          右側：
            7～8列目、1～6行目

          つまり、

            row >= 5
              または
            col >= 7

          のどちらかを満たす場所だけが有効です。

          ボタンが複数マスを使用する場合は、
          そのボタンが占有するすべてのマスを確認します。
        */
        for (let y = row; y < row + height; y++) {

          for (let x = col; x < col + width; x++) {

            /*
              5行目・6行目なら横8列すべて使用可能です。

              それより上の行では7列目・8列目だけ使用できます。
            */
            const isAllowed =
              y >= 5 || x >= 7;

            if (!isAllowed) {

              return false;

            }

          }

        }


        /*
          ----------------------------------------------------------
          ③ 他のボタンとの重なりを確認
          ----------------------------------------------------------

          配置編集領域に存在するすべての操作ボタンを調べます。

          現在移動させているボタン自身は、
          重なり判定から除外します。
        */
        const buttons =
          layoutEditorArea.querySelectorAll(".layout-preview-btn");


        for (const other of buttons) {

          // 自分自身との重なりは確認しません。
          if (other === button) continue;


          // 比較対象となるボタンの現在位置と大きさを取得します。
          const otherCol = Number(other.dataset.layoutCol);
          const otherRow = Number(other.dataset.layoutRow);

          const otherWidth = Number(other.dataset.layoutWidth);
          const otherHeight = Number(other.dataset.layoutHeight);


          /*
            2つの長方形が重なっているかを判定します。

            例えば、
              移動先が別のボタンの左側にある
              移動先が別のボタンの右側にある
              移動先が別のボタンの上側にある
              移動先が別のボタンの下側にある

            いずれかであれば重なっていません。

            反対に、どの方向にも完全に離れていなければ、
            ボタン同士が重なっています。
          */
          const overlaps =
            col < otherCol + otherWidth &&
            col + width > otherCol &&
            row < otherRow + otherHeight &&
            row + height > otherRow;


          if (overlaps) {

            return false;

          }

        }


        // すべての確認を通過したので配置可能です。
        return true;

      }


      /*
        ============================================================
        ボタンの配置を更新する
        ============================================================

        button
          → 配置を変更するボタン

        col・row
          → 新しい配置位置

        この関数では、次の2つを同時に更新します。

          ① HTMLのdata属性
          ② CSS Grid上の実際の配置

        data属性は後で配置を保存するときにも利用します。
      */
      function setLayoutButtonPosition(button, col, row) {

        // ボタンが占有するマス数を取得します。
        const width = Number(button.dataset.layoutWidth);
        const height = Number(button.dataset.layoutHeight);


        /*
          ----------------------------------------------------------
          data属性の更新
          ----------------------------------------------------------

          現在のボタン位置をHTML側にも記録します。

          これによって、次の移動時にも
          最新の配置情報を取得できます。
        */
        button.dataset.layoutCol = col;
        button.dataset.layoutRow = row;


        /*
          ----------------------------------------------------------
          CSS Gridの配置を更新
          ----------------------------------------------------------

          grid-column
            → 横方向の配置

          grid-row
            → 縦方向の配置

          spanを使うことで、
          ボタンが使用するマス数を維持できます。

          例えば、横2マス×縦1マスのボタンを
          3列目・5行目に配置する場合、

            grid-column: 3 / span 2
            grid-row: 5 / span 1

          となります。
        */
        button.style.gridColumn =
          `${col} / span ${width}`;

        button.style.gridRow =
          `${row} / span ${height}`;

      }

      /*
        ============================================================
        配置編集モードの座標をゲーム画面へ反映する
        ============================================================

        配置編集モード：
          共通の横8列×縦6行

        ゲーム画面：
          左側 → 横6列×縦2行
          右側 → 横2列×縦6行

        この2つの座標の違いを変換する関数です。

        重要：
        配置編集モードで保存した位置を変更するのではなく、
        ゲーム画面側のボタンの位置だけを変更します。

        ------------------------------------------------------------
        座標の変換方法
        ------------------------------------------------------------

        【下部に配置する場合】

        配置編集モード：
          列1～6、行5～6

        ゲーム画面：
          列1～6、行1～2

        そのため、
          ゲーム画面の列 = 配置編集モードの列
          ゲーム画面の行 = 配置編集モードの行 - 4

        【右側に配置する場合】

        配置編集モード：
          列7～8、行1～6

        ゲーム画面：
          列1～2、行1～6

        そのため、
          ゲーム画面の列 = 配置編集モードの列 - 6
          ゲーム画面の行 = 配置編集モードの行

        ------------------------------------------------------------
        ボタンの移動方法
        ------------------------------------------------------------

        appendChild()を使って、実際のゲームボタンを
        左側または右側のGridへ移動させます。

        HTML要素そのものを移動するため、
        既に登録されているクリック・タッチイベントは維持されます。
      */
      function applyLayoutToGame() {

        // 左側の操作領域を取得します。
        const bottomArea =
          document.getElementById("game-bottom-area");

        // 右側の操作領域を取得します。
        const rightArea =
          document.getElementById("game-right-area");


        /*
          必要なHTML要素が見つからない場合は終了します。

          HTMLのIDを変更した場合などに備えた確認です。
        */
        if (!bottomArea || !rightArea) {

          console.warn("ゲーム画面の操作領域が見つかりません。");

          return;

        }


        /*
          ----------------------------------------------------------
          ① 配置編集モードのボタンを取得
          ----------------------------------------------------------

          こちらには、常に7種類のボタンがあります。

          表示・非表示に関係なく、すべて取得します。
        */
        const previewButtons =
          layoutEditorArea.querySelectorAll(
            ".layout-preview-btn"
          );


        /*
          ----------------------------------------------------------
          ② 実際のゲーム画面のボタンを取得
          ----------------------------------------------------------

          現在は左右のどちらかに配置されています。

          今回は、両方の領域にあるボタンをまとめて取得します。

          querySelectorAll()で取得したリストは、
          取得時点の要素を保持します。

          そのため、この後appendChild()で移動させても、
          残りのボタンを探すことができます。
        */
        const gameButtons = Array.from(
          document.querySelectorAll(
            "#game-bottom-area .touch-btn, " +
            "#game-right-area .touch-btn"
          )
        );


        /*
          ==========================================================
          ③ 7種類のボタンを順番に処理
          ==========================================================
        */
        previewButtons.forEach(previewButton => {


          /*
            --------------------------------------------------------
            ボタンの種類を取得
            --------------------------------------------------------

            配置編集モード側：
              data-layout-action

            ゲーム画面側：
              data-action

            名前を照合して、対応するボタンを探します。
          */
          const action =
            previewButton.dataset.layoutAction;


          const gameButton = gameButtons.find(
            button => button.dataset.action === action
          );


          // 対応するボタンが見つからなければ処理しません。
          if (!gameButton) {

            console.warn(
              `ゲーム画面に ${action} のボタンが見つかりません。`
            );

            return;

          }


          /*
            --------------------------------------------------------
            配置編集モードで保存されている座標を取得
            --------------------------------------------------------
          */
          const col =
            Number(previewButton.dataset.layoutCol);

          const row =
            Number(previewButton.dataset.layoutRow);

          const width =
            Number(previewButton.dataset.layoutWidth);

          const height =
            Number(previewButton.dataset.layoutHeight);


          /*
            --------------------------------------------------------
            ④ どちらの領域に配置するか判定
            --------------------------------------------------------

            すでにisValidLayoutPosition()で配置範囲を制限していますが、
            念のためここでも確認します。

            下部：
              1～6列、5～6行

            右側：
              7～8列、1～6行
          */
          const isBottomRegion =
            col >= 1 &&
            col + width - 1 <= 6 &&
            row >= 5 &&
            row + height - 1 <= 6;


          const isRightRegion =
            col >= 7 &&
            col + width - 1 <= 8 &&
            row >= 1 &&
            row + height - 1 <= 6;


          // どちらにも正しく収まらなければ適用しません。
          if (!isBottomRegion && !isRightRegion) {

            console.warn(
              `${action} の配置が正しくありません。`
            );

            return;

          }


          /*
            --------------------------------------------------------
            ⑤ ゲーム画面用の座標に変換
            --------------------------------------------------------

            変換後の列・行を保存する変数です。
          */
          let localCol;
          let localRow;

          let destination;


          if (isBottomRegion) {

            /*
              下部に配置する場合

              配置編集モード：
                列1～6、行5～6

              ゲーム画面：
                列1～6、行1～2
            */
            destination = bottomArea;

            localCol = col;

            localRow = row - 4;

          } else {

            /*
              右側に配置する場合

              配置編集モード：
                列7～8、行1～6

              ゲーム画面：
                列1～2、行1～6
            */
            destination = rightArea;

            localCol = col - 6;

            localRow = row;

          }


          /*
            --------------------------------------------------------
            ⑥ 実際のゲームボタンを移動
            --------------------------------------------------------

            appendChild()によって、
            ボタンを目的のGridの中へ移動させます。

            すでに同じGridにある場合は、
            そのままそのGrid内で位置を更新します。
          */
          destination.appendChild(gameButton);


          /*
            --------------------------------------------------------
            ⑦ 保存情報をゲーム画面側にも反映
            --------------------------------------------------------

            data属性には共通座標を保存します。

            一方、CSS Gridには変換後のローカル座標を指定します。

            この区別が重要です。

            共通座標：
              配置編集モード・保存処理で使用

            ローカル座標：
              実際のゲーム画面の表示で使用
          */
          gameButton.dataset.layoutCol = col;

          gameButton.dataset.layoutRow = row;

          gameButton.dataset.layoutWidth = width;

          gameButton.dataset.layoutHeight = height;


          // 左右それぞれのGrid内での表示位置を設定します。
          gameButton.style.gridColumn =
            `${localCol} / span ${width}`;

          gameButton.style.gridRow =
            `${localRow} / span ${height}`;

        });


      }

      /*
        ============================================================
        ボタン配置の保存
        ============================================================

        現在のボタン配置をlocalStorageに保存します。

        localStorageとは：
          ブラウザ内部にデータを保存しておける仕組みです。

          ページを再読み込みしてもデータが残ります。

        今回保存する情報：

          action
            → ボタンの種類

          col
            → 横方向の配置位置

          row
            → 縦方向の配置位置

          width
            → 横方向に使用するマス数

          height
            → 縦方向に使用するマス数

        JSON.stringify()を使ってデータを文字列に変換し、
        localStorageへ保存します。
      */
      function saveLayout() {

        // 配置編集領域にあるすべての操作ボタンを取得します。
        const buttons =
          layoutEditorArea.querySelectorAll(".layout-preview-btn");


        /*
          ----------------------------------------------------------
          ① 保存するデータを作成
          ----------------------------------------------------------

          map()を使って、各ボタンの配置情報を取り出します。

          ボタンそのものを保存するのではなく、
          ボタンの種類と配置情報だけを保存します。
        */
        const layoutData = Array.from(buttons).map(button => ({

          action: button.dataset.layoutAction,

          col: Number(button.dataset.layoutCol),

          row: Number(button.dataset.layoutRow),

          width: Number(button.dataset.layoutWidth),

          height: Number(button.dataset.layoutHeight)

        }));


        /*
          ----------------------------------------------------------
          ② localStorageへ保存
          ----------------------------------------------------------

          "keshiRisuButtonLayout"という名前で保存します。

          この名前は保存データを識別するためのキーです。

          今後、別の設定を保存する場合は、
          別のキーを使用することでデータを区別できます。
        */
        try {

          localStorage.setItem(
            "keshiRisuButtonLayout",
            JSON.stringify(layoutData)
          );

          // 保存した配置を実際のゲーム画面にも反映します。
          applyLayoutToGame();

          // 保存できた場合は画面に結果を表示します。
          document.getElementById("layout-save-status").textContent =
            "配置を保存しました！";


        } catch (error) {

          /*
            保存に失敗した場合です。

            ブラウザの設定などによっては、
            localStorageが利用できない場合があります。
          */
          document.getElementById("layout-save-status").textContent =
            "保存できませんでした。ブラウザの設定を確認してください。";

          console.error("ボタン配置の保存に失敗しました。", error);

        }

      }

      /*
        ============================================================
        保存したボタン配置の読み込み
        ============================================================

        localStorageに保存されているボタン配置を読み込み、
        配置編集画面に反映する関数です。

        この関数はゲーム起動時に1回実行します。

        保存されている情報：
          ・ボタンの種類
          ・横方向の配置位置
          ・縦方向の配置位置
          ・横方向に使用するマス数
          ・縦方向に使用するマス数

        読み込み時には、保存データが正しいか確認します。

        例えば、
          ・存在しないボタンの情報が含まれている
          ・マス目の範囲外に配置されている
          ・ボタン同士が重なっている
          ・L字型の配置範囲からはみ出している

        といった場合は、保存データを適用しません。
      */
      function loadLayout() {

        try {

          /*
            ----------------------------------------------------------
            ① 保存データを取得
            ----------------------------------------------------------

            saveLayout()で使用したものと同じ名前を指定します。

            保存データが存在しない場合はnullが返ってきます。

            その場合は初期配置のままにします。
          */
          const savedText = localStorage.getItem(
            "keshiRisuButtonLayout"
          );

          if (!savedText) return;


          /*
            JSON.parse()
              → localStorageに保存した文字列を、
                JavaScriptで扱える配列・オブジェクトに戻します。
          */
          const savedData = JSON.parse(savedText);


          // 保存データが配列でなければ読み込みません。
          if (!Array.isArray(savedData)) return;


          /*
            ----------------------------------------------------------
            ② 現在存在するボタンを取得
            ----------------------------------------------------------

            HTML側に存在するすべての配置編集用ボタンを取得します。

            保存データと現在のボタンを、
            data-layout-actionを使って対応させます。
          */
          const buttons = Array.from(
            layoutEditorArea.querySelectorAll(
              ".layout-preview-btn"
            )
          );


          /*
            現在のボタン数と保存データの数が違う場合は、
            適用しないようにします。

            将来ボタンの種類が増えた場合などに、
            古い保存データが不完全な状態で適用されるのを防ぎます。
          */
          if (savedData.length !== buttons.length) {
            console.warn("保存されたボタン配置の数が一致しません。");
            return;
          }


          /*
            ----------------------------------------------------------
            ③ 保存データを検証
            ----------------------------------------------------------

            ここでは、すべてのボタンの配置が正しいか確認します。

            注意：
            まだ実際のボタン位置は変更しません。

            すべてのデータを確認して問題がなければ、
            最後にまとめて配置を反映します。
          */
          const proposedPositions = [];

          const usedActions = new Set();


          for (const data of savedData) {

            // 保存データの基本的な形式を確認します。
            if (!data || typeof data !== "object") {
              console.warn("保存データの形式が正しくありません。");
              return;
            }


            // ボタンの種類を確認します。
            if (typeof data.action !== "string") {
              console.warn("ボタンの種類が正しくありません。");
              return;
            }


            /*
              同じ種類のボタンが複数登録されていないか確認します。
            */
            if (usedActions.has(data.action)) {
              console.warn("同じボタンが複数登録されています。");
              return;
            }

            usedActions.add(data.action);


            /*
              HTML側から、対応するボタンを探します。
            */
            const button = buttons.find(
              item => item.dataset.layoutAction === data.action
            );


            // 対応するボタンが存在しない場合は適用しません。
            if (!button) {
              console.warn("保存データに対応するボタンがありません。");
              return;
            }


            /*
              --------------------------------------------------------
              配置情報を数値として取得
              --------------------------------------------------------
            */
            const col = data.col;
            const row = data.row;

            const width = data.width;
            const height = data.height;


            /*
              整数であるか確認します。

              例えば、
                3
                5
                8

              は有効ですが、

                2.5
                "abc"
                null

              などは無効です。
            */
            if (
              !Number.isInteger(col) ||
              !Number.isInteger(row) ||
              !Number.isInteger(width) ||
              !Number.isInteger(height)
            ) {

              console.warn("配置情報に不正な数値があります。");
              return;

            }


            /*
              --------------------------------------------------------
              ボタンサイズの確認
              --------------------------------------------------------

              現段階ではボタンサイズを変更できないため、
              HTML側で設定している大きさと一致している必要があります。

              将来サイズ変更機能を実装した際には、
              この部分も変更します。
            */
            if (
              width !== Number(button.dataset.layoutWidth) ||
              height !== Number(button.dataset.layoutHeight)
            ) {

              console.warn("保存されたボタンサイズが一致しません。");
              return;

            }


            // ボタンの大きさが1マス以上あるか確認します。
            if (width < 1 || height < 1) {
              return;
            }


            /*
              --------------------------------------------------------
              ④ マス目からはみ出していないか確認
              --------------------------------------------------------

              全体は横8マス×縦6マスです。

              ボタンの右端・下端が範囲を超えないか確認します。
            */
            if (
              col < 1 ||
              row < 1 ||
              col + width - 1 > 8 ||
              row + height - 1 > 6
            ) {

              console.warn("保存された配置が範囲外です。");
              return;

            }


            /*
              --------------------------------------------------------
              ⑤ L字型の配置範囲を確認
              --------------------------------------------------------

              下部：
                1～6列目、5～6行目

              右側：
                7～8列目、1～6行目

              ボタンが占有するすべてのマスを確認します。
            */
            for (let y = row; y < row + height; y++) {

              for (let x = col; x < col + width; x++) {

                const isAllowed =
                  y >= 5 || x >= 7;

                if (!isAllowed) {

                  console.warn("保存された配置がL字型の範囲外です。");
                  return;

                }

              }

            }


            /*
              ここまで問題がなければ、
              仮の配置情報として保存しておきます。

              まだ画面上のボタン位置は変更していません。
            */
            proposedPositions.push({

              button,
              col,
              row,
              width,
              height

            });

          }


          /*
            ----------------------------------------------------------
            ⑥ ボタン同士が重なっていないか確認
            ----------------------------------------------------------

            保存された配置情報同士を比較します。

            既存の画面配置ではなく、
            これから適用する予定の配置同士を確認することが重要です。
          */
          for (
            let i = 0;
            i < proposedPositions.length;
            i++
          ) {

            for (
              let j = i + 1;
              j < proposedPositions.length;
              j++
            ) {

              const a = proposedPositions[i];
              const b = proposedPositions[j];


              const overlaps =
                a.col < b.col + b.width &&
                a.col + a.width > b.col &&
                a.row < b.row + b.height &&
                a.row + a.height > b.row;


              if (overlaps) {

                console.warn("保存されたボタン配置が重なっています。");
                return;

              }

            }

          }


          /*
            ----------------------------------------------------------
            ⑦ すべての確認が完了したので配置を反映
            ----------------------------------------------------------

            ここまでエラーがなければ、
            保存された座標を実際のボタンへ反映します。

            setLayoutButtonPosition()を利用することで、
            data属性とCSS Gridの両方を更新できます。
          */
          for (const item of proposedPositions) {

            setLayoutButtonPosition(
              item.button,
              item.col,
              item.row
            );

          }


          console.log("ボタン配置を読み込みました。");


        } catch (error) {

          /*
            ----------------------------------------------------------
            読み込みに失敗した場合
            ----------------------------------------------------------

            localStorageが利用できない場合や、
            保存データが壊れている場合などに実行されます。

            読み込みに失敗しても、
            HTMLに記述されている初期配置でゲームを利用できます。
          */
          console.error(
            "ボタン配置の読み込みに失敗しました。",
            error
          );

        }

      }

      /*
        ============================================================
        ドラッグ開始
        ============================================================

        ボタンを押した瞬間に呼び出します。

        Pointer Eventsを使用しているため、
        PCのマウスとスマートフォンのタッチを
        同じ処理で扱えます。
      */
      function startLayoutDrag(event) {

        // ボタン配置画面が閉じている場合は何もしません。
        if (layoutScreen.hidden) return;


        // マウスの右クリックなどはドラッグに使用しません。
        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {

          return;

        }


        // ブラウザ標準のタッチ・選択操作を抑制します。
        event.preventDefault();


        // 今回押されたボタンを取得します。
        const button = event.currentTarget;


        /*
          ----------------------------------------------------------
          押した位置を記録
          ----------------------------------------------------------

          ボタンの中央を押した場合と、
          端を押した場合で、ドラッグ時の位置がずれないようにします。

          例えばボタンの右端を押したなら、
          移動中もその右端付近に指がある状態を維持します。
        */
        const rect = button.getBoundingClientRect();


        // 現在のドラッグ情報を保存します。
        layoutDrag = {

          button: button,

          pointerId: event.pointerId,

          offsetX: event.clientX - rect.left,

          offsetY: event.clientY - rect.top

        };


        /*
          ポインターキャプチャを設定します。

          ボタンを押したまま指やマウスがボタンの外へ移動しても、
          ドラッグ操作を継続できるようにします。
        */
        try {

          button.setPointerCapture(event.pointerId);

        } catch (error) {

          // キャプチャに失敗した場合も通常の処理は継続します。

        }


        // ドラッグ中であることをCSSに伝えます。
        button.classList.add("is-dragging");

      }



      /*
        ============================================================
        ドラッグ中の処理
        ============================================================

        ポインターが移動するたびに呼び出します。

        指やマウスの位置から、
        配置先のマス目を計算します。

        配置可能な場所なら移動を確定し、
        配置できない場所なら現在位置を維持します。
      */
      function moveLayoutDrag(event) {

        // ドラッグ中でなければ何もしません。
        if (!layoutDrag) return;


        // 別の指・マウスによる操作は無視します。
        if (event.pointerId !== layoutDrag.pointerId) return;


        // ブラウザのスクロールなどを抑制します。
        event.preventDefault();


        // 編集領域全体の位置と大きさを取得します。
        const areaRect =
          layoutEditorArea.getBoundingClientRect();


        /*
          ----------------------------------------------------------
          ① 1マスの大きさを計算
          ----------------------------------------------------------

          全体は横8マス×縦6マスです。

          領域の幅を8で割れば、横方向の1マスの大きさになります。

          領域の高さを6で割れば、縦方向の1マスの大きさになります。

          aspect-ratioによって全体を8:6にしているため、
          原則として縦横のマスの大きさは等しくなります。
        */
        const cellWidth = areaRect.width / 8;
        const cellHeight = areaRect.height / 6;


        // 表示サイズが取得できなかった場合は終了します。
        if (cellWidth <= 0 || cellHeight <= 0) return;


        /*
          ----------------------------------------------------------
          ② 指・マウスの位置から配置候補を計算
          ----------------------------------------------------------

          areaRect.left・top
            → 編集領域の左上位置

          offsetX・offsetY
            → ボタン内で押した位置

          これらを利用して、
          ボタンの左上がどのマスに来るかを計算します。

          Math.floor()
            → 小数点以下を切り捨てます。

          これによって、ボタンがマス目に吸着するようになります。
        */
        const col = Math.floor(
          (
            event.clientX -
            areaRect.left -
            layoutDrag.offsetX
          ) / cellWidth
        ) + 1;


        const row = Math.floor(
          (
            event.clientY -
            areaRect.top -
            layoutDrag.offsetY
          ) / cellHeight
        ) + 1;


        /*
          ----------------------------------------------------------
          ③ 配置可能か確認
          ----------------------------------------------------------

          L字型の範囲内で、他のボタンと重ならない場合だけ
          実際に配置を更新します。

          無効な場所へ移動した場合は、
          最後に配置できた場所にボタンが残ります。
        */
        if (
          isValidLayoutPosition(
            layoutDrag.button,
            col,
            row
          )
        ) {

          setLayoutButtonPosition(
            layoutDrag.button,
            col,
            row
          );

        }

      }



      /*
        ============================================================
        ドラッグ終了
        ============================================================

        ボタンを離したときに呼び出します。

        ドラッグ中の見た目を解除し、
        現在の配置を確定します。

        今回はまだブラウザを再読み込みすると
        初期配置に戻ります。

        配置の保存機能は、別途追加します。
      */
      function endLayoutDrag(event) {

        // ドラッグ中でなければ何もしません。
        if (!layoutDrag) return;


        // 別の指・マウスによる操作は無視します。
        if (event.pointerId !== layoutDrag.pointerId) return;


        // ドラッグしていたボタンを取得します。
        const button = layoutDrag.button;


        // ドラッグ中の見た目を解除します。
        button.classList.remove("is-dragging");


        // ポインターキャプチャを解除します。
        try {

          if (
            button.hasPointerCapture(event.pointerId)
          ) {

            button.releasePointerCapture(event.pointerId);

          }

        } catch (error) {

          // 解除に失敗してもドラッグ終了処理は継続します。

        }


        // ドラッグ状態を終了します。
        layoutDrag = null;

      }



      /*
        ============================================================
        ドラッグイベントの登録
        ============================================================

        各操作ボタンにドラッグ開始イベントを登録します。

        pointerdown
          → ボタンを押した

        pointermove
          → 指・マウスが移動した

        pointerup
          → ボタンを離した

        pointercancel
          → 操作が中断された

        pointermove・pointerupなどはdocument側で受け取ります。

        これによって、ドラッグ中にボタンの位置が変わっても
        操作を継続できます。
      */
      const layoutPreviewButtons =
        layoutEditorArea.querySelectorAll(".layout-preview-btn");


      // すべての配置編集用ボタンに、ドラッグ開始処理を登録します。
      layoutPreviewButtons.forEach(button => {

        button.addEventListener(
          "pointerdown",
          startLayoutDrag
        );

      });

      /*
        ============================================================
        配置保存ボタンのイベント登録
        ============================================================

        「配置を保存」ボタンが押されたら、
        saveLayout()を実行します。
      */
      document.getElementById("layout-save-btn")
        .addEventListener(
          "click",
          saveLayout
        );


      // 指・マウスが移動したとき
      document.addEventListener(
        "pointermove",
        moveLayoutDrag
      );


      // 指・マウスを離したとき
      document.addEventListener(
        "pointerup",
        endLayoutDrag
      );


      // OSやブラウザによって操作が中断されたとき
      document.addEventListener(
        "pointercancel",
        endLayoutDrag
      );


      /*
        ブラウザが非表示になった場合も、
        ドラッグ状態を解除します。

        例えばスマートフォンで別のアプリへ切り替えた場合などです。
      */
      document.addEventListener(
        "visibilitychange",
        () => {

          if (document.hidden && layoutDrag) {

            layoutDrag.button.classList.remove("is-dragging");

            layoutDrag = null;

          }

        }
      );


      /*
        ==========================================================
        15. ゲームの初期化
        ==========================================================

        ゲームを最初からやり直すときや、
        クリア後に次のお題へ進むときに使います。

        keepStats
          → trueならスコアなどを維持
          → falseならスコアなどをリセット

        お題をクリアして次へ進む場合は、
        それまでのスコアを維持します。
      */
      function resetGame(keepStats = false) {

        /*
          スコアを維持しない場合は、
          スコア・ライン数・レベルを初期値に戻します。
        */
        if (!keepStats) {

          score = 0;
          lines = 0;
          level = 1;

        }


        // 新しいお題を作ります。
        createPuzzle();


        // 落下タイミングなどの情報を初期化します。
        dropCounter = 0;
        lastTime = 0;
        // 接地してからの経過時間もリセットする
        lockDelayCounter = 0;
        // 固定時間のリセット回数も初期化する
        lockResetCount = 0;


        // ゲームの状態を初期化します。
        paused = false;
        gameOver = false;
        clearedPuzzle = false;
        running = true;


        /*
          次のブロックと、現在操作するブロックを作成します。

          ここでは次のブロックを先に決めておき、
          その後に現在のブロックを生成しています。
        */
        nextType = randomType();

        piece = makePiece(randomType());


        // 画面表示を更新します。
        updateStats();
        drawNext();
        draw();

        // メッセージを非表示にします。
        hideOverlay();


        /*
          新しいお題の上に、
          最初のブロックが重なっていないか確認します。

          初期配置は下10段だけなので通常は起きませんが、
          万一に備えた確認です。
        */
        if (collides(piece)) {

          piece = makePiece(nextType);

        }

      }



      /*
        ==========================================================
        16. ゲームオーバー処理
        ==========================================================

        新しいブロックを出現させられない場合などに呼び出します。

        runningをfalseにすることで、
        通常のゲーム進行を停止します。
      */
      function endGame() {

        running = false;
        gameOver = true;


        showOverlay(
          "ゲームオーバー",

          `スコア：<strong>${score.toLocaleString("ja-JP")}</strong><br>
           消したライン：${lines}`,

          "もう一度遊ぶ"
        );

      }



      /*
        ==========================================================
        17. 一時停止処理
        ==========================================================

        一時停止と再開を切り替えます。

        pausedがtrueなら一時停止中、
        falseなら通常プレイ中です。

        すでにゲームオーバーやクリア状態の場合は、
        一時停止できないようにしています。
      */
      function togglePause() {

        // ゲームオーバーまたはゲームが動いていない場合は何もしません。
        if (gameOver || !running) return;


        // trueとfalseを切り替えます。
        paused = !paused;


        if (paused) {

          // 一時停止画面を表示します。
          showOverlay(
            "一時停止中",
            "",
            "再開"
          );

        } else {

          // メッセージを消してゲームを再開します。
          hideOverlay();

          /*
            lastTimeを0に戻すことで、
            再開直後に大きな時間差が発生しないようにします。
          */
          lastTime = 0;

        }

      }



      /*
        ==========================================================
        18. ハードドロップ
        ==========================================================

        ブロックを一気に落下させる処理です。

        Spaceキーから呼び出されます。

        盤面に衝突する直前までブロックを下げ、
        その位置で固定します。
      */
      function hardDrop() {

        // 操作できない状態なら何もしません。
        if (!running || paused || gameOver) return;


        // 何マス落下したかを記録します。
        let distance = 0;


        /*
          1マスずつ下へ移動できるか確認します。

          移動できる間はpiece.yを増やします。
          移動した回数をdistanceに記録します。
        */
        while (!collides(piece, 0, 1)) {

          piece.y++;

          distance++;

        }


        /*
          ハードドロップでは、
          落下距離に応じてスコアを加算します。
        */
        score += distance * 2;

        updateStats();


        // 落下先でブロックを固定します。
        lockPiece();

        // 盤面を再描画します。
        draw();

      }

      /*
        ============================================================
        19. ブロックの移動
        ============================================================

        ブロックを左右・上下に移動させます。

        今回は、左右移動に成功した場合に
        ロックディレイをリセットする処理も追加しています。

        dx
          → 横方向の移動量

        dy
          → 縦方向の移動量

        例えば、
          move(-1, 0) → 左へ1マス
          move(1, 0)  → 右へ1マス
          move(0, 1)  → 下へ1マス
      */
      function move(dx, dy) {

        // ゲームを操作できない状態なら何もしません。
        if (!running || paused || gameOver) return;


        /*
          ------------------------------------------------------------
          ① 移動する直前の接地状態を記録
          ------------------------------------------------------------

          操作する前から接地していたかどうかを調べます。

          この情報は、左右移動に成功した際に
          固定時間をリセットするかどうかの判定に使います。

          なお、ここではまだブロックを移動させていません。
        */
        const wasGrounded = collides(piece, 0, 1);


        /*
          ------------------------------------------------------------
          ② 移動可能か確認
          ------------------------------------------------------------

          移動先に壁や別のブロックがなければ、
          実際にブロックの位置を変更します。
        */
        if (!collides(piece, dx, dy)) {

          // 横方向の位置を変更します。
          piece.x += dx;

          // 縦方向の位置を変更します。
          piece.y += dy;


          /*
            ----------------------------------------------------------
            ③ 左右移動に成功した場合のロックディレイ処理
            ----------------------------------------------------------

            dx !== 0
              → 左右方向への移動であることを確認します。

            wasGrounded
              → 移動前から接地していたことを確認します。

            この2つを満たした場合だけ、
            固定時間のリセットを試みます。

            下方向への移動ではリセットしません。

            特に、自動落下処理から呼び出されるmove(0, 1)で
            リセットが繰り返されるのを防ぐためです。
          */
          if (dx !== 0 && wasGrounded) {

            resetLockDelayByAction(wasGrounded);

          }

        }


        /*
          ------------------------------------------------------------
          ④ 盤面の再描画
          ------------------------------------------------------------

          移動できた場合も、壁などにぶつかって移動できなかった場合も、
          最後に盤面を描き直します。
        */
        draw();

      }

      /*
        ============================================================
        20. 時間経過による自動落下・接地後の固定
        ============================================================

        frame()は、ブラウザのアニメーション機能によって
        繰り返し呼び出される関数です。

        今回は従来の自動落下に加えて、
        ブロックが接地してから固定されるまでの時間も管理します。

        接地してからLOCK_DELAYミリ秒経過すると、
        lockPiece()によってブロックを固定します。
      */
      function frame(time = 0) {

        // ゲームが停止している場合は、以降の処理を行いません。
        if (!running) return;


        /*
          前回の処理から何ミリ秒経過したかを計算します。

          time
            → 現在の時刻

          lastTime
            → 前回の時刻
        */
        const delta = lastTime
          ? time - lastTime
          : 0;

        lastTime = time;


        // 一時停止中でなければ、ゲームを進行させます。
        if (!paused && !gameOver) {


          /*
            ----------------------------------------------------------
            ① 通常の自動落下
            ----------------------------------------------------------

            従来どおり、一定時間が経過したら
            ブロックを1マス下へ移動させます。

            レベルが上がるほど落下速度も上がります。
          */
          dropCounter += delta;


          const interval = Math.max(
            90,
            800 * Math.pow(0.82, level - 1)
          );


          if (dropCounter > interval) {

            move(0, 1);

            dropCounter = 0;

          }


          /*
            ----------------------------------------------------------
            ② ブロックが接地しているか確認
            ----------------------------------------------------------

            collides(piece, 0, 1)は、
            現在のブロックを1マス下へ移動させた場合に
            何かと衝突するかどうかを調べます。

            true
              → これ以上下に移動できない。接地している。

            false
              → まだ下に移動できる。接地していない。

            ここでは実際にブロックを移動させていません。
            あくまで接地しているかどうかを確認しています。
          */
          if (collides(piece, 0, 1)) {


            /*
              --------------------------------------------------------
              ③ 接地している時間を計測
              --------------------------------------------------------

              接地している間だけ、経過時間を加算します。

              deltaは前回のframe()からの経過時間です。

              例えば、
                1回目：16ミリ秒
                2回目：16ミリ秒
                3回目：17ミリ秒

              といった具合に加算されていきます。
            */
            lockDelayCounter += delta;


            /*
              --------------------------------------------------------
              ④ 固定までの時間を超えたか確認
              --------------------------------------------------------

              接地してから500ミリ秒経過したら、
              現在のブロックを固定します。

              500ミリ秒に達するまでは固定しません。

              その間も左右移動や回転が可能です。
            */
            if (lockDelayCounter >= LOCK_DELAY) {

              // 固定処理を実行する前に時間をリセットします。
              lockDelayCounter = 0;

              // ブロックを盤面に固定します。
              lockPiece();

            }

          } else {


            /*
              --------------------------------------------------------
              ⑤ 接地状態から抜け出した場合
              --------------------------------------------------------

              ブロックが再び下へ移動できる状態になった場合は、
              接地時間をリセットします。

              例えば、接地中に左右へ移動して、
              下に空間がある場所へ移動した場合です。

              その後、再び接地したら、
              もう一度500ミリ秒の計測を始めます。
            */
            lockDelayCounter = 0;

          }


          // 盤面を再描画します。
          draw();

        }


        /*
          次のアニメーション処理を予約します。

          runningがfalseになれば、
          関数の最初でreturnするため処理は停止します。
        */
        requestAnimationFrame(frame);

      }

      /*
        ==========================================================
        21. 画面下部の操作ボタン
        ==========================================================

        今回追加した操作ボタンの中心となる部分です。

        ここでは、

          ・どのボタンが押されたか
          ・押している間に何をするか
          ・ボタンが離されたらどうするか

        を管理します。

        マウス操作とスマートフォンのタッチ操作を
        どちらも扱えるように、Pointer Eventsを使用します。
      */


      /*
        ----------------------------------------------------------
        現在押されているボタンの情報
        ----------------------------------------------------------

        heldControl
          → 現在押しているボタンの情報

        holdDelayTimer
          → 長押しの連続動作を開始するまでのタイマー

        holdRepeatTimer
          → 連続動作を繰り返すためのタイマー

        最初に押した瞬間はすぐに操作を実行し、
        少し待ってから連続動作を開始します。
      */
      let heldControl = null;

      let holdDelayTimer = null;

      let holdRepeatTimer = null;


      /*
        ----------------------------------------------------------
        長押しで連続動作させるボタン
        ----------------------------------------------------------

        左・右・下の3種類は、
        押し続けることで連続動作させます。

        回転ボタンはここに含めません。

        そのため、回転ボタンは長押ししても1回だけ回転します。
      */
      const REPEATABLE_ACTIONS = [
        "left",
        "right",
        "down"
      ];


      /*
        ----------------------------------------------------------
        ボタン操作を実行する関数
        ----------------------------------------------------------

        action
          → 実行する操作の種類

        HTML側のdata-actionと対応しています。

        キーボード操作と画面ボタン操作が、
        同じmove()やtryRotate()を使用するようにしています。
      */
      function runControlAction(action) {

        
        // 設定ボタンが押された場合は設定画面を開きます。
        if (action === "settings") {

          openSettings();

          return;

        }

        // 予備ボタンは、現在は何も実行しません。
        if (action === "spare") {

          return;

        }


        // ゲームを操作できない状態なら何もしません。
        if (!running || paused || gameOver) {
          return;
        }


        /*
          操作の種類に応じて処理を振り分けます。

          switchは、複数の候補から
          条件に合う処理を選ぶための命令です。
        */
        switch (action) {

          // 左移動
          case "left":

            move(-1, 0);

            break;


          // 右移動
          case "right":

            move(1, 0);

            break;


          /*
            下移動

            1マス下へ移動し、
            ソフトドロップとして1点加算します。

            下に移動できない場合は、
            move()の中でブロックが固定されます。
          */
          case "down":

            move(0, 1);

            score++;

            updateStats();

            break;


          // 反時計回りの回転
          case "rotate-left":

            tryRotate("left");

            break;


          // 時計回りの回転
          case "rotate-right":

            tryRotate("right");

            break;

        }

      }



      /*
        ----------------------------------------------------------
        長押し状態を解除する関数
        ----------------------------------------------------------

        ボタンを離したときに呼び出します。

        連続動作に使用しているタイマーを停止し、
        現在押しているボタンの情報を消去します。

        この処理を忘れると、
        ボタンを離した後も移動が続いてしまいます。
      */
      function stopHeldControl(pointerId = null) {

        /*
          pointerIdが指定されていて、
          現在押しているボタンと一致しない場合は、
          別の指やマウスの操作と判断して何もしません。

          複数のポインターが関係する場合の誤停止を防ぎます。
        */
        if (
          pointerId !== null &&
          heldControl &&
          heldControl.pointerId !== pointerId
        ) {
          return;
        }


        // 長押し開始までの待機タイマーを停止します。
        if (holdDelayTimer !== null) {

          clearTimeout(holdDelayTimer);

          holdDelayTimer = null;

        }


        // 連続動作用のタイマーを停止します。
        if (holdRepeatTimer !== null) {

          clearInterval(holdRepeatTimer);

          holdRepeatTimer = null;

        }


        // 押しているボタンの情報を消去します。
        heldControl = null;

      }



      /*
        ----------------------------------------------------------
        ボタンが押されたときの処理
        ----------------------------------------------------------

        Pointer Eventsのpointerdownを使用しています。

        pointerdownは、
          ・マウスでボタンを押したとき
          ・スマートフォンで画面を触ったとき
        の両方で発生します。

        そのため、PC用とスマートフォン用で
        別々の処理を用意する必要がありません。
      */
      function handleControlPointerDown(event) {

        // マウスの右クリックなどは操作に使用しません。
        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }


        /*
          ブラウザ標準の動作を抑制します。

          これによって、
          タッチ操作中にスクロールや選択などが起きるのを防ぎます。
        */
        event.preventDefault();


        // 押されたボタンの種類を取得します。
        const action =
          event.currentTarget.dataset.action;


        /*
          すでに別のボタンを押していた場合は、
          先にそのボタンの連続動作を停止します。
        */
        stopHeldControl();


        /*
          現在押されているボタンの情報を保存します。

          pointerIdは、どの指・マウスによる操作なのかを
          区別するための番号です。

          buttonは、実際に押されたHTML要素です。
        */
        heldControl = {
          pointerId: event.pointerId,
          button: event.currentTarget,
          action
        };


        /*
          ポインターキャプチャを設定します。

          これによって、ボタンを押したまま指やマウスが
          ボタンの外へ移動しても、
          その後のpointerupなどを受け取りやすくなります。

          押したままボタンの外へ移動したときに
          連続移動が止まらなくなる問題を防ぐための設定です。
        */
        try {

          event.currentTarget.setPointerCapture(
            event.pointerId
          );

        } catch (error) {

          /*
            ポインターキャプチャに失敗しても、
            通常の操作自体は実行できるようにしています。

            その場合もdocument側のイベントで
            ボタンが離されたことを確認します。
          */

        }


        /*
          --------------------------------------------------------
          押した瞬間に1回操作
          --------------------------------------------------------

          長押しの連続動作を待つ前に、
          まず1回操作を実行します。

          これによって、
          軽くタップしただけでもすぐに反応します。
        */
        runControlAction(action);


        /*
          --------------------------------------------------------
          長押し対応
          --------------------------------------------------------

          左・右・下のボタンだけを連続動作させます。

          回転ボタンはREPEATABLE_ACTIONSに含まれないため、
          ここには入りません。

          最初の操作から180ミリ秒待った後、
          80ミリ秒ごとに操作を繰り返します。

          数値を変更すると、長押しの速度を調整できます。
        */
        if (
          REPEATABLE_ACTIONS.includes(action)
        ) {

          // 長押しと判断するまでの待機時間
          holdDelayTimer = setTimeout(() => {

            /*
              80ミリ秒間隔で連続操作を実行します。

              例えば左ボタンなら、
              80ミリ秒ごとに1マス左へ移動します。
            */
            holdRepeatTimer = setInterval(() => {

              /*
                途中でゲームが停止した場合は、
                連続操作も終了させます。
              */
              if (
                !running ||
                paused ||
                gameOver
              ) {

                stopHeldControl();

                return;

              }


              /*
                最初に押したボタンと同じ操作を繰り返します。
              */
              runControlAction(action);

            }, 80);

          }, 180);

        }

      }



      /*
        ----------------------------------------------------------
        操作ボタンへのイベント登録
        ----------------------------------------------------------

        data-action属性を持つボタンをすべて取得し、
        それぞれに操作イベントを登録します。

        今回はPointer Eventsを使用するため、
        マウスとタッチの両方に対応できます。
      */
      const controlButtons =
        document.querySelectorAll(
          ".touch-btn[data-action]"
        );


      // 取得したすべての操作ボタンに対して設定します。
      controlButtons.forEach(button => {


        // ボタンが押されたとき
        button.addEventListener(
          "pointerdown",
          handleControlPointerDown
        );


        /*
          contextmenuは、右クリックなどで表示される
          ブラウザのメニューを指します。

          操作ボタン上では、
          長押しなどの際にブラウザメニューが出るのを防ぎます。
        */
        button.addEventListener(
          "contextmenu",
          event => event.preventDefault()
        );

      });



      /*
        ----------------------------------------------------------
        ボタンが離されたときの処理
        ----------------------------------------------------------

        pointerup
          → ボタンが離された

        pointercancel
          → ブラウザなどの都合で操作が中断された

        このどちらかが発生した場合、
        連続動作を停止します。

        documentに登録することで、
        ボタンの外でイベントが発生した場合にも対応します。
      */
      document.addEventListener(
        "pointerup",
        event => {
          stopHeldControl(event.pointerId);
        }
      );


      document.addEventListener(
        "pointercancel",
        event => {
          stopHeldControl(event.pointerId);
        }
      );


      /*
        ----------------------------------------------------------
        ブラウザ画面からフォーカスが外れた場合
        ----------------------------------------------------------

        例えば、
          ・別のウィンドウに切り替えた
          ・ブラウザ以外の画面を操作した
        といった場合です。

        そのまま連続移動が残らないように、
        タイマーを停止します。
      */
      window.addEventListener(
        "blur",
        () => stopHeldControl()
      );


      /*
        ----------------------------------------------------------
        ブラウザの表示が隠れた場合
        ----------------------------------------------------------

        スマートフォンで別のアプリに切り替えた場合などに、
        連続操作が残らないようにします。
      */
      document.addEventListener(
        "visibilitychange",
        () => {

          if (document.hidden) {

            stopHeldControl();

          }

        }
      );



      /*
        ==========================================================
        22. ゲーム画面のボタン操作
        ==========================================================

        ゲーム開始・一時停止・やり直しのボタンに
        イベントを登録します。

        addEventListener("click", ...)

        は、ボタンがクリックされたときに
        指定した処理を実行するための命令です。
      */


      /*
        ----------------------------------------------------------
        ゲーム開始・再開・次のお題ボタン
        ----------------------------------------------------------

        同じボタンを、状況に応じて使い分けています。

        一時停止中
          → ゲーム再開

        お題クリア後
          → スコアを維持したまま次のお題へ

        それ以外
          → 新しいゲームを開始
      */
      startBtn.addEventListener(
        "click",
        () => {

          /*
            一時停止中なら、
            ゲームを再開します。
          */
          if (
            paused &&
            !gameOver &&
            !clearedPuzzle
          ) {

            paused = false;
            running = true;

            hideOverlay();

            lastTime = 0;

            requestAnimationFrame(frame);

          }


          /*
            お題をクリアしていた場合は、
            これまでのスコアを維持して次のお題を開始します。
          */
          else if (clearedPuzzle) {

            resetGame(true);

            requestAnimationFrame(frame);

          }


          /*
            それ以外の場合は、
            スコアなども含めて新しくゲームを開始します。
          */
          else {

            resetGame();

            requestAnimationFrame(frame);

          }

        }
      );



      /*
        一時停止ボタン

        クリックされたらtogglePause()を実行します。
      */
      document.getElementById("pause-btn")
        .addEventListener(
          "click",
          togglePause
        );

      /*
        設定画面の「戻る」ボタンにイベントを登録します。

        クリックされたらcloseSettings()を実行し、
        設定画面を閉じてゲーム画面に戻ります。
      */
      document.getElementById("settings-close-btn")
        .addEventListener(
          "click",
          closeSettings
        );

      /*
        ============================================================
        ボタン配置設定への移動
        ============================================================

        設定画面にある「ボタン配置を変更」ボタンを押すと、
        ボタン配置モードへ移動します。

        HTML側のsettings-layout-btnと、
        JavaScript側のopenLayoutEditor()を連携させています。
      */
      document.getElementById("settings-layout-btn")
        .addEventListener(
          "click",
          openLayoutEditor
        );


      /*
        ============================================================
        ボタン配置モードから設定画面へ戻る
        ============================================================

        ボタン配置画面にある「設定に戻る」を押すと、
        設定画面に戻ります。

        ゲームの一時停止状態は維持されます。
      */
      document.getElementById("layout-close-btn")
        .addEventListener(
          "click",
          closeLayoutEditor
        );

      /*
        やり直すボタン

        ゲームを初期化して、最初からやり直します。
      */
      document.getElementById("restart-btn")
        .addEventListener(
          "click",
          () => {

            resetGame();

            requestAnimationFrame(frame);

          }
        );



      /*
        ==========================================================
        23. キーボード操作
        ==========================================================

        PCでの操作を受け付ける部分です。

        今回、スマートフォン用の操作ボタンを追加しましたが、
        これまでのキーボード操作も引き続き使用できます。

        なお、上下左右やSpaceキーの操作は、
        ブラウザページ自体のスクロールなどに使われることがあります。

        そのため、ゲーム操作中はpreventDefault()で
        ブラウザ標準の動作を抑制しています。
      */
      document.addEventListener(
        "keydown",
        event => {

          /*
            ブラウザ標準の動作を抑制するキーです。

            ArrowLeft
              → 左矢印

            ArrowRight
              → 右矢印

            ArrowDown
              → 下矢印

            ArrowUp
              → 上矢印

            " "
              → Space
          */
          const keys = [
            "ArrowLeft",
            "ArrowRight",
            "ArrowDown",
            "ArrowUp",
            " "
          ];


          if (keys.includes(event.key)) {

            event.preventDefault();

          }


          /*
            Rキー：やり直し

            toLowerCase()を使うことで、
            大文字・小文字の違いを気にせず判定できます。
          */
          if (
            event.key.toLowerCase() === "r"
          ) {

            resetGame();

            return;

          }


          /*
            Pキー：一時停止

            togglePause()によって、
            一時停止と再開を切り替えます。
          */
          if (
            event.key.toLowerCase() === "p"
          ) {

            togglePause();

            return;

          }


          /*
            ゲームを操作できない状態なら、
            ここで処理を終了します。

            これ以降のキー操作は実行されません。
          */
          if (
            !running ||
            paused ||
            gameOver
          ) {

            return;

          }


          /*
            ------------------------------------------------------
            左矢印
            ------------------------------------------------------
          */
          if (event.key === "ArrowLeft") {

            move(-1, 0);

          }


          /*
            ------------------------------------------------------
            右矢印
            ------------------------------------------------------
          */
          else if (event.key === "ArrowRight") {

            move(1, 0);

          }


          /*
            ------------------------------------------------------
            下矢印
            ------------------------------------------------------

            1マス下へ移動します。
            ソフトドロップとして1点加算します。
          */
          else if (event.key === "ArrowDown") {

            move(0, 1);

            score++;

            updateStats();

          }


          /*
            ------------------------------------------------------
            上矢印
            ------------------------------------------------------

            右回転、つまり時計回りに回転させます。

            今回追加した画面下部の左回転ボタンは、
            tryRotate("left")を呼び出すことで
            反時計回りに回転させています。
          */
          else if (event.key === "ArrowUp") {

            tryRotate("right");

          }


          /*
            ------------------------------------------------------
            Spaceキー
            ------------------------------------------------------

            ブロックを一気に落とします。
          */
          else if (event.key === " ") {

            hardDrop();

          }

        }
      );



      /*
        ==========================================================
        24. 最初に表示するゲーム画面の準備
        ==========================================================

        HTMLファイルを開いた直後に実行する初期設定です。

        まだゲームは開始せず、
        スタート画面の後ろに盤面を表示しておきます。
      */


      // スコアなどを初期化します。
      score = 0;
      lines = 0;
      level = 1;


      // ゲームの状態を初期化します。
      paused = false;
      gameOver = false;
      clearedPuzzle = false;


      // 最初のお題を作ります。
      createPuzzle();

      // 前回保存したボタン配置を読み込みます。
      loadLayout();

      // 読み込んだ配置を実際のゲーム画面に反映します。
      applyLayoutToGame();

      // 最初に操作するブロックを作ります。
      piece = makePiece(randomType());


      // NEXTに表示するブロックを決めます。
      nextType = randomType();


      // 数値の表示を更新します。
      updateStats();


      // NEXT表示を描画します。
      drawNext();


      // メイン盤面を描画します。
      draw();


      /*
        最初のアニメーション処理を予約します。

        この時点ではrunningがtrueになっていないため、
        frame()の最初の判定で終了します。

        ゲーム開始ボタンを押したときに、
        改めてframe()が呼び出されてゲームが動き始めます。
      */
      requestAnimationFrame(frame);


    })();

  </script>

</body>
